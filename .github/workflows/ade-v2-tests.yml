name: ADE v2 isolated unit tests
on:
  pull_request:
    paths:
      - 'ade_v2/**'
      - 'tests/test_ade_v2_*.py'
      - '.github/workflows/ade-v2-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ADE v2 unit tests (stdlib only)
        run: python -m unittest discover -s tests -p 'test_ade_v2_*.py' -v
