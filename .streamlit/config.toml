[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EDF3FA"
textColor = "#13253E"
# Pretendard is an optional local fallback in decision_desk.css.
# Keep these options compatible with the pinned Streamlit release.
font = "sans serif"

[client]
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
headless = true
