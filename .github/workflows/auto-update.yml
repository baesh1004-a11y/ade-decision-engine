name: ADE Auto Update Signal

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ade-auto-update
  cancel-in-progress: true

jobs:
  signal-update:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 5

    steps:
      - name: Signal ADE update
        shell: powershell
        run: |
          $project = 'C:\Project\ADE\ade-decision-engine'
          $runtime = Join-Path $project 'runtime'
          $flag = Join-Path $runtime 'update.flag'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Set-Content -Path $flag -Value '${{ github.sha }}' -Encoding UTF8
          Write-Host "ADE update signal written: $flag"

      - name: Confirm runner test
        shell: powershell
        run: |
          Write-Host "ADE runner test completed at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
