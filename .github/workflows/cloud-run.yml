name: ADE Cloud KIS Secret Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kis-secret-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KIS_ENV: paper
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          required = [
              "KIS_APP_KEY",
              "KIS_APP_SECRET",
              "KIS_ACCOUNT",
              "KIS_ACCOUNT_NO",
          ]
          missing = [name for name in required if not os.getenv(name)]

          if missing:
              print("Missing GitHub repository secrets: " + ", ".join(missing))
              sys.exit(1)

          print("All required KIS repository secrets are available.")
          print("No secret values were printed.")
          PY

      - name: Import-check ADE broker modules
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "broker.kis",
              "broker.kis_market_data",
              "broker.kis_trading",
          ]

          for module_name in modules:
              importlib.import_module(module_name)
              print(f"Imported: {module_name}")
          PY
