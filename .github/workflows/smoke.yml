name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Compile repository
        run: python -m compileall .
      - name: Ruff checks
        run: ruff check broker dashboard datahub markets recommendation jp_radar tests
      - name: Import smoke tests
        env:
          KIS_APP_KEY: ''
          KIS_APP_SECRET: ''
          KIS_ACCOUNT_NO: ''
          KIS_ENV: paper
        run: |
          python -c "import dashboard_app"
          python -c "from broker.kis import KISBrokerAdapter, kis_broker_from_env, kis_config_from_env"
          python -c "from dashboard.market_overview_service import load_market_overview"
          python -c "from broker.kis_websocket import KISWebSocketMarketClient; KISWebSocketMarketClient()"
      - name: Pytest stabilization suite
        env:
          KIS_APP_KEY: ''
          KIS_APP_SECRET: ''
          KIS_ACCOUNT_NO: ''
          KIS_ENV: paper
        run: pytest -q
      - name: Start Streamlit headless
        env:
          KIS_APP_KEY: ''
          KIS_APP_SECRET: ''
          KIS_ACCOUNT_NO: ''
          KIS_ENV: paper
        run: |
          set -euo pipefail
          timeout 45s python -m streamlit run dashboard_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; wait $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-logs-${{ github.run_id }}
          path: |
            /tmp/streamlit.log
            .pytest_cache
          if-no-files-found: ignore
          retention-days: 7