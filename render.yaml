services:
  - type: web
    name: ade-decision-engine
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m datahub.db_sync && (python -m scripts.run_scheduled_orders &) && exec python -m streamlit run dashboard_app.py --server.address 0.0.0.0 --server.port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ADE_DATA_DIR
        value: datahub
      - key: MARKET_DB_ARCHIVE_URL
        value: https://pub-952a5fb7e0c6404e8a91d0ac4f32b660.r2.dev/ade-market-db.zip
      - key: US_MARKET_DB_ARCHIVE_URL
        sync: false
      - key: DB_SYNC_FORCE_REFRESH
        value: "0"
      - key: KIS_ENV
        value: paper
      - key: KIS_APP_KEY
        sync: false
      - key: KIS_APP_SECRET
        sync: false
      - key: KIS_ACCOUNT_NO
        sync: false
      - key: KIS_ACCOUNT_PRODUCT_CODE
        value: "01"
      - key: KIS_BASE_URL
        value: https://openapivts.koreainvestment.com:29443
      - key: KIS_TIMEOUT_SECONDS
        value: "10"
      - key: SCHEDULED_ORDER_POLL_SECONDS
        value: "30"
      - key: SCHEDULED_ORDER_REQUIRE_APPROVAL
        value: "0"
